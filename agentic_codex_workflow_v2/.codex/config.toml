# Project-level Codex configuration for the Agentic Codex workflow (V2 systemized).
# Goals:
# - policy / orchestration / capability / state / controller separation
# - review router + specialist reviewers
# - script-first structured writeback

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1
job_max_runtime_seconds = 1800

[agents.explorer]
description = "Context explorer for DISCUSS / ALIGN_PROOF and code-anchored fact finding before planning or implementation."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Implementation-focused agent for exactly one phase at a time, allowed to write only within the phase boundary and required to self-describe outputs."
config_file = "agents/worker.toml"

[agents.plan_reviewer]
description = "Independent plan gatekeeper. Reads the PLAN_REVIEW task pack, loads the specialist plan review skill, writes a structured review bundle, and returns PASS or NEEDS_CHANGES."
config_file = "agents/plan_reviewer.toml"

[agents.close_reviewer]
description = "Independent final reviewer. Reads the CLOSE_REVIEW task pack, loads the specialist close review skill, writes a structured review bundle, and returns PASS / NEEDS_FIX / BLOCKED."
config_file = "agents/close_reviewer.toml"

[agents.monitor]
description = "Monitoring agent for long-running verification commands, waits, polling, and concise status reporting."
config_file = "agents/monitor.toml"
