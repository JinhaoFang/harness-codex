name: harness-checks

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run harness tests
        run: python3 -m unittest discover -s harness/tests
      - name: Harness doctor
        run: python3 harness/cli/harnessctl.py doctor
      - name: Validate harness artifacts
        run: python3 harness/cli/harnessctl.py validate --all --strict
      - name: Harness lifecycle CI gate
        run: python3 harness/cli/harnessctl.py ci --strict
      - name: Skill catalog gate
        run: python3 harness/cli/harnessctl.py check --gate skills --strict
