schema_version: harness.mechanism_registry.v2
mechanisms:
  - mechanism: tracked-feature-spec
    type: doc
    purpose: "Keep user intent, boundaries, evidence claims and approval metadata visible to every developer."
    failure_mode: "Intent exists only in chat or disposable local state."
    protected_invariant: "Intent is externalized and survives local runtime loss."
    validation_method: "Spec gate, approval content hash, resume tests and CI spec validation."
    known_cost: "One maintained document per non-trivial feature."
    removal_condition: "Replace only if an issue/spec system provides equally durable repository-linked intent and approval."
    status: active

  - mechanism: ignored-local-runtime
    type: state
    purpose: "Hold technical plan, command logs, evidence index, review track and handoff without repository document churn."
    failure_mode: "The repository accumulates large transient ledgers or sessions cannot resume locally."
    protected_invariant: "Runtime context is useful but never the sole product truth."
    validation_method: "Git ignore/adoption tests and destructive resume test."
    known_cost: "Exact local execution history is lost when the directory is deleted."
    removal_condition: "Replace if a lower-cost shared runtime store is needed and can preserve identity separation."
    status: active

  - mechanism: lifecycle-controller
    type: controller-check
    purpose: "Own phase transitions, scope checks, command execution, evidence freshness and review lineage."
    failure_mode: "Agent starts early, self-reports PASS, crosses scope or closes its own work."
    protected_invariant: "Agent produces candidates; controller checks mechanical acceptability."
    validation_method: "harness/tests/test_harnessctl.py and HEB fault cases."
    known_cost: "A single Python CLI must remain tested and small enough to understand."
    removal_condition: "Replace when native platform controls cover the same invariants with lower cost."
    status: active

  - mechanism: phase-write-policy
    type: hook
    purpose: "Prevent product edits during clarification/planning and enforce reviewer read-only/scope boundaries."
    failure_mode: "Agent silently moves from discussion to implementation or reviewer becomes a second builder."
    protected_invariant: "Work is bounded and lifecycle roles have explicit capabilities."
    validation_method: "Hook policy tests plus platform smoke tests."
    known_cost: "Depends on platform tool events and may require repository-specific path tuning."
    removal_condition: "Remove if sandbox/policy-as-code supplies equivalent phase and path enforcement."
    status: active

  - mechanism: controller-executed-verification
    type: evidence
    purpose: "Derive pass/fail from an observed process and bind it to implementation content."
    failure_mode: "Agent fabricates or accidentally misstates test execution; old evidence survives new changes."
    protected_invariant: "Completion is based on fresh evidence, not claims."
    validation_method: "Command execution, exit-code and stale-content tests."
    known_cost: "Local logs consume ignored disk space and external CI needs a future import adapter."
    removal_condition: "Replace only with an equally verifiable local/CI evidence provider."
    status: active

  - mechanism: single-review-track
    type: reviewer
    purpose: "Carry plan-review risks into close review while re-grounding on current code, diff and evidence."
    failure_mode: "Plan and close reviewers are unrelated, or builder context contaminates acceptance."
    protected_invariant: "Acceptance is separable from generation and judgment continuity is explicit."
    validation_method: "Reviewer identity/session and close-review freshness tests."
    known_cost: "Reviewer takeover is intentionally not automated in the default profile."
    removal_condition: "Change only after real collaboration cases justify a controlled takeover protocol."
    status: active

  - mechanism: curated-skill-catalog
    type: skill
    purpose: "Route task-specific workflows without bloating AGENTS.md or CLAUDE.md."
    failure_mode: "Always-on context becomes a lifecycle manual and important rules lose signal."
    protected_invariant: "Context is routed, not accumulated."
    validation_method: "Skill mirror/content gate and adoption tests."
    known_cost: "Canonical and platform mirrors require synchronization."
    removal_condition: "Merge or delete unused/duplicated skills; replace when platform-native workflows are clearer."
    status: active

  - mechanism: structured-check-argv
    type: controller-check
    purpose: "Preserve exact command arguments, including embedded quotes and spaces, without shell reparsing."
    failure_mode: "A generic scalar cleaner strips a closing quote and forces a targeted check to degrade into a broad command."
    protected_invariant: "Declared evidence is executed exactly and observably."
    validation_method: "Embedded-space/quote round-trip regression and package test suite."
    known_cost: "Specs must maintain explicit check definitions instead of convenient shell snippets."
    removal_condition: "Replace only if another typed command representation provides equivalent shell-free execution."
    status: active

  - mechanism: thin-platform-dispatcher
    type: controller-check
    purpose: "Execute valid lifecycle transitions and bind real Codex/Claude sessions without a resident scheduler."
    failure_mode: "The state machine only prints next steps, agents pause between normal phases, or reviewer continuity is a self-attested string."
    protected_invariant: "Automatic work remains state/hash gated and Plan/Close Review resume one real logical session."
    validation_method: "Adapter command/resume tests, dry-run transition tests, and platform smoke tests."
    known_cost: "Depends on current platform CLI capabilities; actual CLI smoke tests are environment-specific."
    removal_condition: "Remove if both platforms expose an equivalent controller-bound dispatcher with auditable session identity."
    status: active

  - mechanism: codex-persisted-goal-binding
    type: controller-check
    purpose: "Bind an approved Work Unit to Codex's actual thread-scoped Goal while keeping Controller acceptance authoritative."
    failure_mode: "A long-running worker only receives Goal-like prose, loses its objective across continuation, or Goal completion is mistaken for evidence."
    protected_invariant: "Platform execution state can aid continuity but cannot replace contract, evidence, review, or risk authority."
    validation_method: "Fake app-server protocol regression plus environment-specific adapter smoke test."
    known_cost: "One short-lived app-server bootstrap and a local binding record; platform Goal failures require visible degraded fallback."
    removal_condition: "Remove if codex exec gains first-class programmatic Goal creation with equivalent persisted thread identity and audit output."
    status: active

  - mechanism: single-repo-snapshot
    type: controller-check
    purpose: "Capture Git branch/head/diff/workspace once per decision and separate repository from worktree identity."
    failure_mode: "Repeated Git subprocesses cause slow or inconsistent gates; linked worktrees collide or appear to be different repositories."
    protected_invariant: "One transition evaluates one coherent repository snapshot."
    validation_method: "Full-suite timing and linked-worktree identity regression."
    known_cost: "Snapshot contents can become stale if retained across a later mutation; callers must capture per transition."
    removal_condition: "Replace if a lower-cost Git library provides an atomic equivalent snapshot."
    status: active

  - mechanism: github-delivery-gate
    type: controller-check
    purpose: "Bind optional PR/CI integration to the current local HEAD and explicitly named required checks."
    failure_mode: "A reviewed local diff is archived while the PR points to another commit or required CI is missing/failing."
    protected_invariant: "Integration state is current and does not silently substitute for claim evidence."
    validation_method: "PR-head and required-check regression tests."
    known_cost: "Requires gh and exact check-name configuration only when a PR is linked."
    removal_condition: "Remove if branch protection/CI evidence import supplies the same deterministic local gate."
    status: active

  - mechanism: adoption-ownership-manifest
    type: workflow
    purpose: "Upgrade generated Harness assets without overwriting repository-owned modifications."
    failure_mode: "Incremental installation silently keeps obsolete files forever or an upgrade overwrites local changes."
    protected_invariant: "Harness evolution is reversible and conflicts are visible."
    validation_method: "Install, successful upgrade, and local-conflict tests."
    known_cost: "One small tracked hash manifest; repository-owned conflicting files remain unmanaged."
    removal_condition: "Replace when a native package/template manager provides equivalent ownership and conflict semantics."
    status: active

  - mechanism: deterministic-release-package
    type: ci
    purpose: "Make the delivered zip reproducible, self-verifying, and free of ignored runtime/cache state."
    failure_mode: "A hand-made archive contains stale .harness state, pyc files, or assets from another source revision."
    protected_invariant: "The distributed Harness can be reconstructed and verified from its manifest."
    validation_method: "Byte-for-byte package determinism, SHA-256 manifest, clean extraction, tests and controller gates."
    known_cost: "Release verification runs the complete test suite in a temporary extraction."
    removal_condition: "Replace if a signed release pipeline provides equal or stronger reproducibility and clean-room checks."
    status: active
