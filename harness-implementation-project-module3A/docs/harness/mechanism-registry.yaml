schema_version: harness.mechanism_registry.v1
mechanisms:
  - mechanism: harnessctl
    type: controller-check
    purpose: "Own Work Unit state transitions, evidence freshness checks, review gates, and handoff generation."
    failure_mode: "Agent claims completion without fresh evidence, silently crosses scope, leaves unrecoverable state, reruns close review for receipt/commit noise, or rewrites useful clarification into brittle control fields."
    protected_invariant: "No hidden state; no completion without evidence or waiver; review separated from evidence; review validity is based on implementation/judgment surface, not artifact id churn."
    validation_method: "harness/tests plus HEB-E-001, HEB-S-001, HEB-R-001, finalize-check surface cases, and natural-language clarification contract tests."
    known_cost: "Small CLI to maintain; requires developers/agents to run controller commands; surface-based review validity adds comparison logic."
    owner: "platform-owner"
    introduced_at: "2026-05-27"
    last_reviewed: "2026-06-01"
    removal_condition: "Remove or replace if native platform lifecycle state and evidence checks cover the same gates with lower cost."
    status: active
  - mechanism: pre-tool-use-policy-hook
    type: hook
    purpose: "Block clearly dangerous shell commands and ask for safer paths before irreversible actions."
    failure_mode: "Agent executes destructive command or bypasses review with force push/reset."
    protected_invariant: "Non-negotiable boundaries are not enforced only by prompt."
    validation_method: "Unit tests plus manual hook simulation."
    known_cost: "May false-positive on legitimate maintenance commands."
    owner: "platform-owner"
    introduced_at: "2026-05-27"
    last_reviewed: "2026-05-28"
    removal_condition: "Remove if sandbox/permissions/policy-as-code supersedes it and tests confirm equivalent protection."
    status: active
  - mechanism: stop-without-evidence-hook
    type: hook
    purpose: "Warn or block stop attempts when active work has diff but local completion gates are not satisfied."
    failure_mode: "Premature victory, false completion, or hook-driven loops that ask for full close review after commit materialization or receipt refresh."
    protected_invariant: "Completion is evidence-gated, and hook next actions follow finalize-check rather than stale hard-coded review advice."
    validation_method: "HEB-E-001, controller verification/review/finalize-check gates, and hook simulation tests."
    known_cost: "Can interrupt exploratory sessions; depends on controller output shape; should be bypassable by explicit waiver or no active Work Unit."
    owner: "platform-owner"
    introduced_at: "2026-05-27"
    last_reviewed: "2026-06-01"
    removal_condition: "Remove if controller/CI prevents completion without evidence in all target workflows."
    status: active
  - mechanism: curated-skill-catalog
    type: skill
    purpose: "Provide task-routed workflows without loading a large always-on manual."
    failure_mode: "Context bloat from large AGENTS/CLAUDE files, ad-hoc prompts, unclear commit bodies, or review workflows that are traceable but not human-understandable."
    protected_invariant: "Context is routed, not accumulated; external collaboration artifacts explain the change before listing trace metadata."
    validation_method: "HEB-C-001, user review of skill trigger accuracy, and skills-gate coverage for GitHub issue/commit/PR structure."
    known_cost: "Skill drift and duplicate instructions across platforms."
    owner: "platform-owner"
    introduced_at: "2026-05-27"
    last_reviewed: "2026-06-01"
    removal_condition: "Merge or delete skills that are unused, duplicate another skill, or are superseded by native platform features."
    status: active

  - mechanism: skills-gate
    type: controller-check
    purpose: "Detect incomplete or unsynchronized skill content before skills are copied into Codex or Claude Code adapters."
    failure_mode: "A skill names a workflow such as GitHub collaboration but omits required issue, commit, PR, evidence, review structure, or a platform skill mirror."
    protected_invariant: "Context routing stays useful; skills do not become vague or unsafe lifecycle authority; installed platform skill mirrors match the canonical catalog."
    validation_method: "harnessctl check --gate skills --strict and harness/tests/test_harnessctl.py."
    known_cost: "Small phrase-level validator that must be updated when the curated skill catalog changes."
    owner: "platform-owner"
    introduced_at: "2026-05-28"
    last_reviewed: "2026-06-02"
    removal_condition: "Remove or replace if platform-native skill validation covers completeness, trigger scope, and mirror consistency."
    status: active
  - mechanism: adoption-installer
    type: workflow
    purpose: "Install the harness into target repositories with one command while preserving existing repository instructions, ignore rules, skills, and platform config."
    failure_mode: "Multi-profile copy flows confuse users, blind replacement damages existing AGENTS/CLAUDE/platform config, install leaves .harness uninitialized, or harness files are accidentally committed to the target repo."
    protected_invariant: "Adoption is incremental and platform-specific: codex installs Codex surfaces, claude installs Claude surfaces, common runtime is initialized once, and installed harness-owned paths are ignored locally."
    validation_method: "harness/tests/test_harnessctl.py adoption install tests plus dry-run/manual installer smoke."
    known_cost: "Installer has file-copy policy logic and must avoid becoming a complex merge engine."
    owner: "platform-owner"
    introduced_at: "2026-06-02"
    last_reviewed: "2026-06-02"
    removal_condition: "Replace if a packaged CLI installer provides the same incremental behavior with lower maintenance cost."
    status: active
  - mechanism: minimal-worker-reviewer-subagents
    type: reviewer
    purpose: "Keep only the subagent roles required for generation/acceptance separation while avoiding resident planner, monitor, verifier, or explorer roles."
    failure_mode: "Too many resident subagents create context routing overhead and unclear ownership without improving evidence or review quality."
    protected_invariant: "Acceptance is separable from generation; mechanisms remain prunable and purpose-fit."
    validation_method: "Adapter layout tests assert only worker and reviewer agents are present by default."
    known_cost: "Some repositories may later need isolated explorer or verifier roles; those should be added only with a failure trace."
    owner: "platform-owner"
    introduced_at: "2026-05-28"
    last_reviewed: "2026-05-28"
    removal_condition: "Split roles only when HEB or real failures show reviewer independence, permission isolation, or throughput is insufficient."
    status: active
