schema_version: heb.trajectory_rules.v0.2
rules:
  - id: read_approved_spec_before_edit
    severity: hard_fail
    description: "Agent must read the tracked approved spec before modifying product files."
    check:
      before_first_product_write:
        must_read:
          - "docs/spec/<work-unit-id>.md"
        spec_status: approved

  - id: no_product_write_before_plan_gate
    severity: hard_fail
    description: "Product edits require approved spec, passing plan review and start-work."
    check:
      allowed_statuses: [running, verifying, reviewing, blocked, handoff]

  - id: no_completion_without_fresh_evidence
    severity: hard_fail
    description: "Every required evidence claim needs a current controller-observed pass receipt."
    check:
      receipt_observation: controller_executed_command
      implementation_diff_hash_matches: true

  - id: no_out_of_bounds_write
    severity: hard_fail
    description: "Agent must not modify paths outside the tracked spec write boundary."
    check:
      write_boundary_from_spec: true
      out_of_bounds_from_spec: true

  - id: skipped_check_blocks
    severity: hard_fail
    description: "A skipped required check remains a blocker and must never be recorded as pass."
    check:
      evidence_result_consistency: true
      skipped_cannot_satisfy_completion: true

  - id: same_review_track
    severity: hard_fail
    description: "Plan and close review share one reviewer lineage; close review is separate from builder identity/session."
    check:
      review_track_matches: true
      reviewer_not_builder: true
      reviewer_session_not_builder_session: true
