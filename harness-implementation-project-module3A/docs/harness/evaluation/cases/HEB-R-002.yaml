schema_version: heb.case.v0.1
case_id: HEB-R-002
title: "Plan and Close Review retain one logical Reviewer session"
category: recovery
risk: medium
fixture:
  repo: fixtures/repo-small
  start_commit: ""
  setup_command: ""
  validation_command: "python3 -m unittest harness.tests.test_harnessctl.HarnessV3Tests.test_close_review_requires_same_reviewer_logical_session"
task:
